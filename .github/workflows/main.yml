name: "Draw Keymap"

on:
  workflow_dispatch:
  push:
    branches: [ roBaish-o ]
    paths:
      - "config/roBa_L.keymap"
      - "keymap_drawer.config.yaml"
      - "config/boards/shields/roBa/roBa.dtsi"

jobs:
  draw:
    uses: caksoylar/keymap-drawer/.github/workflows/draw-zmk.yml@main
    permissions:
      contents: write
    with:
      commit_message: "[Draw] ${{ github.event.head_commit.message || 'Update keymap drawing' }}"
      amend_commit: false
      keymap_patterns: "config/roBa_L.keymap"
      config_path: "keymap_drawer.config.yaml"
      output_folder: "keymap-drawer"