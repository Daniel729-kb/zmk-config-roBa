# keymap-drawer configuration for roBa keyboard
# https://github.com/caksoylar/keymap-drawer

# Parse configuration
parse_config:
  # Remove any keycode prefixes if needed
  zmk_remove_keycode_prefix: []
  
  # Additional parsing options
  parse_args: ""

# Draw configuration  
draw_config:
  # Physical layout settings
  physical_layout: "roBa_L"
  
  # Drawing options
  draw_args: ""
  
  # Key styling
  key_style:
    # Key colors
    key_color: "#2d2d2d"
    key_text_color: "#ffffff"
    
    # Key borders
    key_border_color: "#666666"
    key_border_width: 1
    
    # Key spacing
    key_spacing: 2
    
  # Layer styling
  layer_style:
    # Layer colors
    layer_colors:
      - "#2d2d2d"  # Default layer
      - "#1a4d1a"  # Number layer
      - "#4d1a1a"  # Symbol layer
      - "#1a1a4d"  # Function layer
      - "#4d4d1a"  # AML layer
      - "#4d1a4d"  # Settings layer
      - "#1a4d4d"  # Mouse layer
    
    # Layer text
    layer_text_color: "#ffffff"
    
  # Legend styling
  legend_style:
    # Font settings
    font_family: "monospace"
    font_size: 10
    
    # Legend colors
    legend_color: "#ffffff"
    
  # Combo styling
  combo_style:
    combo_color: "#ff6b6b"
    combo_text_color: "#ffffff"
    
  # SVG output settings
  svg_config:
    # SVG dimensions
    width: 1200
    height: 400
    
    # Background
    background_color: "#1a1a1a"
    
    # Padding
    padding: 20
